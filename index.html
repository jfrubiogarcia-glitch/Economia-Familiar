                return { id: snap.id, date: snap.date, liquidity: snap.liquidity, ...curr, diffCartera, pctCartera, diffPatrimonio, pctPatrimonio };
            });

            const MANUAL_FIELDS = [
                ['ingresoTotal', 'Ingreso total (€)'], ['rf', 'Valor RF Mixta (€)'], ['rv', 'Valor RV (+PP) (€)'],
                ['cartera', 'Cartera total (€)'], ['patrimonio', 'Patrimonio total (€)'], ['liquidity', 'Liquidez (€)'],
                ['diffCartera', 'Dif. cartera (€)'], ['diffCarteraPct', 'Dif. cartera (%)'],
                ['diffPatrimonio', 'Dif. patrimonio (€)'], ['diffPatrimonioPct', 'Dif. patrimonio (%)']
            ];
            const [manualDraft, setManualDraft] = useState(null);
            const manualFormRef = useRef(null);
            const openManual = row => {
                const original = row ? snapshots.find(s => s.id === row.id) : null;
                const values = {};
                MANUAL_FIELDS.forEach(([key]) => {
                    const value = key === 'liquidity' ? original?.liquidity :
                        (original?.table2 ? original.table2[key] : (original?.summary?.[key] ?? (key === 'ingresoTotal' ? original?.summary?.ing : null)));
                    values[key] = value == null ? '' : value;
                });
                setManualDraft({ id: row?.id || null, date: row?.date || new Date().toLocaleDateString('sv-SE'), ...values });
                setTimeout(() => manualFormRef.current?.scrollIntoView({ behavior: 'smooth', block: 'center' }), 0);
            };
            const saveManual = e => {
                e.preventDefault();
                if (snapshots.some(s => s.date === manualDraft.date && s.id !== manualDraft.id)) {
                    showMessage('Ya existe un registro en esa fecha. Edita esa fila o elige otra fecha.'); return;
                }
                const table2 = {};
                MANUAL_FIELDS.forEach(([key]) => { if (key !== 'liquidity') table2[key] = parseAmount(manualDraft[key]); });
                if (!Object.values(table2).some(v => v != null) && parseAmount(manualDraft.liquidity) == null) {
                    showMessage('Introduce al menos un importe.'); return;
                }
                const original = snapshots.find(s => s.id === manualDraft.id);
                const entry = { ...original, id: manualDraft.id || generateId(), date: manualDraft.date,
                    liquidity: parseAmount(manualDraft.liquidity), table2, summaryOnly: true };
                if ((manualDraft.id ? updateSnapshot(entry) : addSnapshot(entry)) === false) return;
                setManualDraft(null); showMessage('Registro de la tabla 2 guardado');
            };

            const [compareMode, setCompareMode] = useState('semanal');
            
            const processedHistoryRows = useMemo(() => {
                if (compareMode === 'semanal') return historyRows;
                const map = {};
                historyRows.forEach(r => {
                    const key = compareMode === 'mensual' ? r.date.substring(0, 7) : r.date.substring(0, 4);
                    if (!map[key] || r.date > map[key].date) map[key] = r;
                });
                const groupedArr = Object.values(map).sort((a,b) => b.date.localeCompare(a.date));
                return groupedArr.map((snap, idx, arr) => {
                    const nextSnap = arr[idx + 1];
                    const prevCartera = nextSnap ? nextSnap.cartera : null;
                    const prevPatrimonio = nextSnap ? nextSnap.patrimonio : null;
                    const hasCartera = snap.cartera != null && prevCartera != null;
                    const hasPatrimonio = snap.patrimonio != null && prevPatrimonio != null;
                    const diffCartera = hasCartera ? snap.cartera - prevCartera : null;
                    const pctCartera = hasCartera && prevCartera > 0 ? (diffCartera / prevCartera) * 100 : null;
                    const diffPatrimonio = hasPatrimonio ? snap.patrimonio - prevPatrimonio : null;
                    const pctPatrimonio = hasPatrimonio && prevPatrimonio > 0 ? (diffPatrimonio / prevPatrimonio) * 100 : null;
                    return { ...snap, diffCartera, pctCartera, diffPatrimonio, pctPatrimonio };
                });
            }, [historyRows, compareMode]);

            const CHART_VARS = ['Ingreso Total', 'Renta Fija', 'Renta Variable', 'Cartera Total', 'Patrimonio Total'];
            const [selectedChartVars, setSelectedChartVars] = useState(['Ingreso Total', 'Cartera Total']);
            const [chartStartYear, setChartStartYear] = useState('2020');
            const [chartEndYear, setChartEndYear] = useState(currentYearStr);
            const [chartStartMonth, setChartStartMonth] = useState('01');
            const [chartEndMonth, setChartEndMonth] = useState('12');

            const handleToggleChartVar = (v) => {
                if (selectedChartVars.includes(v)) setSelectedChartVars(selectedChartVars.filter(x => x !== v));
                else setSelectedChartVars([...selectedChartVars, v]);
            };

            const chartData = useMemo(() => {
                const chartStartFull = `${chartStartYear}-${chartStartMonth}`;
                const chartEndFull = `${chartEndYear}-${chartEndMonth}`;

                const chartSnaps = historyRows.slice().reverse().filter(r => {
                    if (chartStartFull && r.date < chartStartFull) return false;
                    if (chartEndFull && r.date > chartEndFull) return false;
                    return true;
                });

                const chartDatasets = [];
                const colors = { 'Ingreso Total': '#9ca3af', 'Renta Fija': '#eab308', 'Renta Variable': '#ef4444', 'Cartera Total': '#3b82f6', 'Patrimonio Total': '#10b981' };

                selectedChartVars.forEach(v => {
                    let data = [];
                    if(v === 'Ingreso Total') data = chartSnaps.map(r => r.ing);
                    if(v === 'Renta Fija') data = chartSnaps.map(r => r.rf);
                    if(v === 'Renta Variable') data = chartSnaps.map(r => r.rv);
                    if(v === 'Cartera Total') data = chartSnaps.map(r => r.cartera);
                    if(v === 'Patrimonio Total') data = chartSnaps.map(r => r.patrimonio);
                    chartDatasets.push({ label: v, data: data, borderColor: colors[v], backgroundColor: colors[v], fill: false, tension: 0.1, borderWidth: v.includes('Total') ? 3 : 2 });
                });
                return { labels: chartSnaps.map(r => r.date), datasets: chartDatasets };
            }, [historyRows, chartStartYear, chartStartMonth, chartEndYear, chartEndMonth, selectedChartVars]);

            return (
                <div className="space-y-6 fade-in w-full max-w-full">
                    <div className="bg-white p-6 rounded-xl shadow-sm border border-teal-200">
                        <div className="flex justify-between items-center mb-4 flex-wrap gap-2">
                            <h2 className="font-black text-teal-800 text-lg flex items-center gap-2"><span>📝</span> {editingSnapId ? 'Editando Fotografía' : 'Añadir Fotografía de la Cartera'}</h2>
                            <div className="flex items-center gap-2">

            const [initial] = useState(() => {
                try { return { data: FamilyBackup.loadDataset(window.localStorage), error: '' }; }
                catch (error) { return { data: FamilyBackup.emptyDataset(), error: 'No se han podido leer los datos guardados. No se han sobrescrito. Descarga el almacenamiento original antes de restaurar una copia válida.' }; }
            });
            const [data, setData] = useState(initial.data);
            const dataRef = useRef(data);
            const [storageError, setStorageError] = useState(initial.error);
            const [recoveryMode, setRecoveryMode] = useState(Boolean(initial.error));
            const [pendingImport, setPendingImport] = useState(null);
            const [readingImport, setReadingImport] = useState(false);
            const [backupRequested, setBackupRequested] = useState(false);
            const [backupConfirmed, setBackupConfirmed] = useState(false);
            const [skipBackup, setSkipBackup] = useState(false);
            const importDialogRef = useRef(null);
            const { incomes, expenses, snapshots, funds } = data;
            useEffect(() => {
                const dialog = importDialogRef.current;
                if (pendingImport && !dialog.open) dialog.showModal();
                else if (!pendingImport && dialog.open) dialog.close();
            }, [pendingImport]);

            const commitData = (next) => {
                if (recoveryMode) return false;
                try {
                    FamilyBackup.saveDataset(window.localStorage, next);
                } catch (error) {
                    setNotification('');
                    setStorageError('No se pudo guardar: comprueba el espacio disponible y los permisos de almacenamiento. Los datos anteriores se conservan; el cambio no se ha aplicado.');
                    return false;
                }
                dataRef.current = next;
                setData(next);
                setStorageError('');
                return true;
            };
            const updateBlock = (key, update) => commitData({ ...dataRef.current,
                [key]: typeof update === 'function' ? update(dataRef.current[key]) : update });
            const setIncomes = update => updateBlock('incomes', update);
            const setExpenses = update => updateBlock('expenses', update);
            const setFunds = update => updateBlock('funds', update);
            const setSnapshots = update => updateBlock('snapshots', update);

            const addIncome = (inc) => setIncomes(prev => [...prev, inc].sort((a,b)=>b.date.localeCompare(a.date)));
            const updateIncome = (updatedInc) => setIncomes(prev => prev.map(i => i.id === updatedInc.id ? updatedInc : i).sort((a,b)=>b.date.localeCompare(a.date)));
            const deleteIncome = (id) => setIncomes(prev => prev.filter(i => i.id !== id));
            
            const addExpense = (exp) => setExpenses(prev => [...prev, exp].sort((a,b)=>b.date.localeCompare(a.date)));
            const updateExpense = (updatedExp) => setExpenses(prev => prev.map(e => e.id === updatedExp.id ? updatedExp : e).sort((a,b)=>b.date.localeCompare(a.date)));
            const deleteExpense = (id) => setExpenses(prev => prev.filter(e => e.id !== id));
            
            const addSnapshot = (snap) => {
                return setSnapshots(prev => {
                    const exists = prev.findIndex(s => s.date === snap.date);
                    let newArr = [...prev];
                    if (exists >= 0) newArr[exists] = snap; else newArr.push(snap);
                    return newArr.sort((a,b)=>b.date.localeCompare(a.date));
                });
            };
            const updateSnapshot = (updatedSnap) => {
                return setSnapshots(prev => prev.map(s => s.id === updatedSnap.id ? updatedSnap : s).sort((a,b)=>b.date.localeCompare(a.date)));
            };
            const deleteSnapshot = (id) => setSnapshots(prev => prev.filter(s => s.id !== id));

            // Calcula los totales de una fotografía. Si ya trae un resumen guardado (table2/summary)
            // se usa ese; si no (p.ej. una fotografía recién añadida en el formulario), se calcula
            // al vuelo a partir del desglose por fondo, igual que hace la Tabla 2 en pantalla.
            const getSnapTotals = (s) => {
                if (s.table2) {
                    return {
                        ing: s.table2.ingresoTotal ?? null, rf: s.table2.rf ?? null, rv: s.table2.rv ?? null,
                        cartera: s.table2.cartera ?? null, patrimonio: s.table2.patrimonio ?? null
                    };
                }
                if (s.summary) {
                    return {
                        ing: s.summary.ingresoTotal ?? s.summary.ing ?? null, rf: s.summary.rf ?? null, rv: s.summary.rv ?? null,
                        cartera: s.summary.cartera ?? null, patrimonio: s.summary.patrimonio ?? null
                    };
                }
                let ing = 0, rf = 0, rv = 0;
                funds.forEach(f => {
                    const sv = s.fundsData?.[f.id]?.ingreso || 0;
                    const vl = s.fundsData?.[f.id]?.value || 0;
                    ing += sv;
                    if (f.type.includes('Fija')) rf += vl; else rv += vl;
                });
                return { ing, rf, rv, cartera: rf + rv, patrimonio: rf + rv + (s.liquidity || 0) };
            };

            const handleExport = () => {
                const sortedSnapsDesc = snapshots.slice().sort((a,b) => b.date.localeCompare(a.date));
                const tabla2EvolucionPatrimonial = sortedSnapsDesc.map((s, idx) => {
                    const curr = getSnapTotals(s);
                    const nextSnap = sortedSnapsDesc[idx + 1];
                    const prev = nextSnap ? getSnapTotals(nextSnap) : { cartera: null, patrimonio: null };
                    const diffCartera = s.table2?.diffCartera ?? ((curr.cartera != null && prev.cartera != null) ? curr.cartera - prev.cartera : null);
                    const diffCarteraPct = s.table2?.diffCarteraPct ?? ((diffCartera != null && prev.cartera > 0) ? (diffCartera / prev.cartera) * 100 : null);
                    const diffPatrimonio = s.table2?.diffPatrimonio ?? ((curr.patrimonio != null && prev.patrimonio != null) ? curr.patrimonio - prev.patrimonio : null);
                    const diffPatrimonioPct = s.table2?.diffPatrimonioPct ?? ((diffPatrimonio != null && prev.patrimonio > 0) ? (diffPatrimonio / prev.patrimonio) * 100 : null);
                    return {
                        date: s.date,
                        ingresoTotal: curr.ing,
                        rf: curr.rf,
                        rv: curr.rv,
                        cartera: curr.cartera,
                        patrimonio: curr.patrimonio,
                        diffCartera, diffCarteraPct, diffPatrimonio, diffPatrimonioPct
                    };
                });
                const data = { incomes, expenses, snapshots, funds, tabla2EvolucionPatrimonial };
                return downloadJSON(data, 'CopiaSeguridad_EconomiaFamiliar.json');
            };

            const downloadJSON = (value, filename) => {
                try {
                    const blob = new Blob([JSON.stringify(value, null, 2)], { type: 'application/json' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = filename;
                    document.body.appendChild(a);
                    try { a.click(); } finally { a.remove(); setTimeout(() => URL.revokeObjectURL(url), 1000); }
                    setNotification('Descarga solicitada. Comprueba que el archivo se ha guardado antes de continuar.');
                    return true;
                } catch (error) {
                    setNotification('❌ No se pudo preparar la descarga. No se ha restaurado ningún dato.');
                    return false;
                }
            };
            const downloadCurrentBackup = () => {
                let requested;
                if (recoveryMode) {
                    try {
                        requested = downloadJSON({ rawStorage: FamilyBackup.readStorageSnapshot(window.localStorage) }, 'Recuperacion_Almacenamiento_Original.json');
                    } catch (error) {
                        setStorageError('No se puede acceder al almacenamiento original. No se ha modificado ningún dato. Revisa los permisos del navegador antes de continuar.');
                        return false;
                    }
                } else {
                    try { FamilyBackup.validateDataset(dataRef.current); }
                    catch (error) {
                        setStorageError('Los datos actuales contienen inconsistencias. La descarga conserva los registros originales, pero necesitará revisión antes de poder restaurarse. No se ha reparado ni eliminado ningún registro.');
                    }
                    requested = handleExport();
                }
                if (requested) setBackupRequested(true);
                return requested;
            };

            const handleImport = (e) => {
                const file = e.target.files[0];
                e.target.value = '';
                if (!file || readingImport || pendingImport) return;
                setReadingImport(true);
                const reader = new FileReader();
                reader.onload = event => {
                    try {
                        const input = event.target.result;
                        const prepared = FamilyBackup.prepareRestore(input, dataRef.current);
                        if (recoveryMode && prepared.replaced.length !== FamilyBackup.BLOCKS.length) {
                            throw new Error('El almacenamiento original no se pudo leer. Para evitar perder bloques desconocidos, restaura una copia completa con ingresos, gastos, fondos y fotografías.');
                        }
                        const storageBefore = FamilyBackup.readStorageSnapshot(window.localStorage);
                        setBackupRequested(false);
                        setBackupConfirmed(false);
                        setSkipBackup(false);
                        setPendingImport({ input, prepared, storageBefore });
                    } catch (error) {
                        setNotification(`❌ No se ha importado ningún dato. ${error instanceof SyntaxError ? 'El archivo no es JSON válido.' : error.message}`);
                    } finally { setReadingImport(false); }
                };
                reader.onerror = () => {
                    setReadingImport(false);
                    setNotification('❌ No se pudo leer el archivo. Los datos anteriores no se han modificado.');
                };
                reader.onabort = reader.onerror;
                try { reader.readAsText(file); } catch (error) { reader.onerror(); }
            };
            const confirmImport = () => {
                if (!pendingImport || !(skipBackup || (backupRequested && backupConfirmed))) return;
                try {
                    const restored = FamilyBackup.restore(window.localStorage, pendingImport.input, dataRef.current, pendingImport.storageBefore);
                    dataRef.current = restored.data;
                    setData(restored.data);
                    setStorageError('');
                    setRecoveryMode(false);
                    setPendingImport(null);
                    setNotification(`Datos restaurados y guardados correctamente. Fotografías: ${restored.data.snapshots.length}.`);
                } catch (error) {
                    setStorageError(`No se ha restaurado ningún dato. Comprueba el archivo, el espacio y los permisos de almacenamiento. ${error.message}`);
                }
            };

            return (
                <div className="min-h-screen pb-20 w-full overflow-x-hidden">
                    <Notification message={notification} onClose={() => setNotification('')} />
                    
                    <header className="bg-white shadow-sm border-b sticky top-0 z-50">
                        <div className="w-full px-4 sm:px-6 lg:px-8">
                            <div className="flex flex-col sm:flex-row justify-between items-center py-4 gap-4">
                                <h1 className="text-xl font-black text-gray-900 tracking-tight flex items-center gap-2">
                                    <span className="text-2xl">💼</span> Economía Familiar
                                </h1>
                                <div className="flex flex-wrap gap-2 items-center">
                                    <button onClick={downloadCurrentBackup} className="px-3 py-1.5 bg-gray-100 text-gray-700 rounded text-xs font-bold hover:bg-gray-200 shadow-sm border border-gray-300">{recoveryMode ? '⬇️ Descargar almacenamiento original' : '⬇️ Exportar Datos'}</button>
                                    <label className="px-3 py-1.5 bg-blue-50 text-blue-700 rounded text-xs font-bold hover:bg-blue-100 cursor-pointer shadow-sm border border-blue-200">
                                        ⬆️ Importar Datos
                                        <input type="file" accept=".json" className="hidden" onChange={handleImport} disabled={readingImport || Boolean(pendingImport)} />
                                    </label>
                                </div>
                            </div>
                            <nav className="flex space-x-6 mt-2 overflow-x-auto no-scrollbar">
                                <button onClick={() => setActiveTab('ingresos')} className={`pb-3 px-1 transition-colors whitespace-nowrap ${activeTab === 'ingresos' ? 'tab-active' : 'tab-inactive'}`}>Ingresos</button>
                                <button onClick={() => setActiveTab('gastos')} className={`pb-3 px-1 transition-colors whitespace-nowrap ${activeTab === 'gastos' ? 'tab-active' : 'tab-inactive'}`}>Gastos</button>
                                <button onClick={() => setActiveTab('inversiones')} className={`pb-3 px-1 transition-colors whitespace-nowrap ${activeTab === 'inversiones' ? 'tab-active' : 'tab-inactive'}`}>Cartera de Inversión</button>
                            </nav>
                        </div>
                    </header>

                    {storageError && <div role="alert" className="m-4 p-4 border border-red-400 bg-red-50 text-red-900 rounded">{storageError}</div>}
                    {readingImport && <p role="status" className="m-4">Leyendo y validando la copia. Todavía no se ha cambiado ningún dato.</p>}
                    <dialog ref={importDialogRef} aria-labelledby="restore-title" onCancel={() => setPendingImport(null)} className="rounded-xl p-6 max-w-xl w-full shadow-xl backdrop:bg-black/50">
                        {pendingImport && <div className="space-y-4">
                            <h2 id="restore-title" className="text-xl font-bold">Revisar restauración JSON</h2>
                            <p>La copia es válida. Se sustituirán los bloques indicados, aunque estén vacíos. Los bloques ausentes conservarán sus datos actuales.</p>
                            <ul className="list-disc pl-5">
                                {FamilyBackup.BLOCKS.map(key => <li key={key}>{({ incomes: 'Ingresos', expenses: 'Gastos', funds: 'Fondos', snapshots: 'Fotografías' })[key]}: {pendingImport.prepared.replaced.includes(key) ? `sustituir por ${pendingImport.prepared.data[key].length} registros` : 'conservar sin cambios'}</li>)}
                            </ul>
                            <p>Antes de sustituir datos, conserva una copia recuperable en un lugar privado.</p>
                            {recoveryMode && <p>La descarga conserva el almacenamiento original sin modificar. Si está dañado, necesitará revisión para recuperarlo; no es una copia JSON lista para importar.</p>}
                            <button type="button" onClick={downloadCurrentBackup} className="px-4 py-2 border rounded">{recoveryMode ? 'Descargar almacenamiento original' : 'Descargar copia de los datos actuales'}</button>
                            {backupRequested && <label className="flex gap-2 items-start"><input type="checkbox" checked={backupConfirmed} onChange={e => setBackupConfirmed(e.target.checked)} />He comprobado que el archivo se ha guardado.</label>}
                            <label className="flex gap-2 items-start"><input type="checkbox" checked={skipBackup} onChange={e => setSkipBackup(e.target.checked)} />Prefiero continuar sin descargar una copia. Entiendo que sustituiré los datos indicados.</label>
                            {storageError && <p role="alert" className="text-red-800">{storageError}</p>}
                            <div className="flex gap-3">
                                <button type="button" onClick={() => setPendingImport(null)} className="px-4 py-2 border rounded">Cancelar</button>
                                <button type="button" onClick={confirmImport} disabled={!(skipBackup || (backupRequested && backupConfirmed))} className="px-4 py-2 bg-blue-700 text-white rounded disabled:opacity-50">Restaurar datos</button>
                            </div>
                        </div>}
                    </dialog>
                    {!recoveryMode && <main className="w-full px-4 sm:px-6 lg:px-8 py-8">
                        {activeTab === 'ingresos' && <IngresosTab incomes={incomes} addIncome={addIncome} updateIncome={updateIncome} deleteIncome={deleteIncome} showMessage={setNotification} />}
                        {activeTab === 'gastos' && <GastosTab expenses={expenses} addExpense={addExpense} updateExpense={updateExpense} deleteExpense={deleteExpense} incomes={incomes} showMessage={setNotification} />}
                        {activeTab === 'inversiones' && <InversionesTab funds={funds} setFunds={setFunds} snapshots={snapshots} addSnapshot={addSnapshot} updateSnapshot={updateSnapshot} deleteSnapshot={deleteSnapshot} showMessage={setNotification} />}
                    </main>}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>

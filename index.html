                <div className="space-y-6 fade-in w-full max-w-full">
                    <div className="bg-white p-6 rounded-xl shadow-sm border border-teal-200">
                        <div className="flex justify-between items-center mb-4 flex-wrap gap-2">
                            <h2 className="font-black text-teal-800 text-lg flex items-center gap-2"><span>📝</span> {editingSnapId ? 'Editando Fotografía' : 'Añadir Fotografía de la Cartera'}</h2>
                            <div className="flex items-center gap-2">
                                <button type="button" onClick={handleOpenAddFund} className="px-3 py-2 bg-teal-600 text-white rounded font-bold text-xs hover:bg-teal-700 shadow">➕ Gestionar Fondos (Añadir/Editar/Borrar)</button>
                            </div>
                        </div>
                        <details open={snapshots.length === 0 || editingSnapId}>
                            <summary className="font-bold text-sm text-teal-700 cursor-pointer outline-none">Desplegar formulario de actualización</summary>
                            <form onSubmit={handleSaveSnapshot} className="mt-4 border-t pt-4">
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                                    <div><label className="block text-sm font-bold text-gray-700">Fecha de la foto</label><input type="date" value={snapDate} onChange={e=>setSnapDate(e.target.value)} className="w-full p-2 border rounded bg-gray-50 outline-teal-500" required /></div>
                                    <div><label className="block text-sm font-bold text-teal-700">Liquidez en Bancos (€)</label><input type="number" step="0.01" value={snapLiquidity} onChange={e=>setSnapLiquidity(e.target.value)} className="w-full p-2 border rounded border-teal-300 font-bold outline-teal-500" required /></div>
                                </div>
                                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 max-h-[50vh] overflow-y-auto pr-2">
                                    {funds.map(f => (
                                        <div key={f.id} className="p-3 bg-gray-50 border rounded hover:border-teal-300 transition-colors">
                                            <div className="flex justify-between items-start">
                                                <p className="font-bold text-sm text-gray-800 truncate" title={f.name}>{f.name}</p>
                                                <button type="button" onClick={()=>handleOpenEditFund(f)} className="text-[10px] text-blue-600 hover:underline">Editar Fondo</button>
                                            </div>
                                            <p className="text-[10px] text-gray-500 uppercase">{f.type} | {f.gestora}</p>
                                            <div className="grid grid-cols-2 gap-2 mt-3">
                                                <div><label className="block text-[10px] font-bold text-gray-600 mb-1">INGRESO</label><input type="number" step="0.01" value={snapFundsData[f.id]?.ingreso ?? ''} onChange={e=>handleFundDataChange(f.id, 'ingreso', e.target.value)} className="w-full p-1.5 border rounded text-sm outline-teal-500" /></div>
                                                <div><label className="block text-[10px] font-bold text-teal-800 mb-1">VALOR ACTUAL</label><input type="number" step="0.01" value={snapFundsData[f.id]?.value ?? ''} onChange={e=>handleFundDataChange(f.id, 'value', e.target.value)} className="w-full p-1.5 border rounded border-teal-300 font-bold text-sm text-teal-900 outline-teal-500" /></div>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                                <div className="flex gap-2 mt-6">
                                    <button type="submit" className="flex-1 bg-teal-700 text-white p-3 rounded-lg font-black hover:bg-teal-800 shadow-lg transition-colors">{editingSnapId ? 'Actualizar Fotografía' : 'Guardar Fotografía Semanal'}</button>
                                    {editingSnapId && <button type="button" onClick={()=>{setEditingSnapId(null);}} className="px-6 bg-gray-300 text-gray-700 rounded-lg font-bold">Cancelar</button>}
                                </div>
                            </form>
                        </details>
                    </div>

                    {showFundModal && (
                        <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
                            <div className="bg-white rounded-xl shadow-2xl p-6 max-w-md w-full fade-in">
                                <h3 className="text-lg font-bold text-teal-900 mb-4">{editingFund ? 'Editar Fondo' : 'Añadir Nuevo Fondo'}</h3>
                                <form onSubmit={handleSaveFundModal} className="space-y-4">
                                    <div><label className="block text-xs font-bold text-gray-600 uppercase mb-1">Nombre del Fondo</label><input type="text" value={fundName} onChange={e=>setFundName(e.target.value)} className="w-full p-2 border rounded" required /></div>
                                    <div><label className="block text-xs font-bold text-gray-600 uppercase mb-1">ISIN</label><input type="text" value={fundIsin} onChange={e=>setFundIsin(e.target.value)} className="w-full p-2 border rounded" placeholder="Ej: ES0140072010 o N5116" /></div>
                                    <div><label className="block text-xs font-bold text-gray-600 uppercase mb-1">Fecha de Inicio</label><input type="date" value={fundStart} onChange={e=>setFundStart(e.target.value)} className="w-full p-2 border rounded" required /></div>
                                    <div>
                                        <label className="block text-xs font-bold text-gray-600 uppercase mb-1">Tipología</label>
                                        <select value={fundType} onChange={e=>setFundType(e.target.value)} className="w-full p-2 border rounded">
                                            <option value="Renta Variable">Renta Variable</option>
                                            <option value="Renta Fija Mixta">Renta Fija Mixta</option>
                                            <option value="Renta Fija">Renta Fija</option>
                                            <option value="Plan de Pensiones">Plan de Pensiones</option>
                                            <option value="Liquidez">Liquidez</option>
                                        </select>
                                    </div>
                                    <div><label className="block text-xs font-bold text-gray-600 uppercase mb-1">Gestora</label><input type="text" value={fundGestora} onChange={e=>setFundGestora(e.target.value)} className="w-full p-2 border rounded" required /></div>
                                    
                                    <div className="flex gap-2 pt-2">
                                        <button type="submit" className="flex-1 bg-teal-600 text-white p-2 rounded font-bold hover:bg-teal-700">Guardar Fondo</button>
                                        {editingFund && <button type="button" onClick={()=>handleDeleteFund(editingFund.id)} className="px-4 bg-red-100 text-red-600 rounded font-bold">Eliminar</button>}
                                        <button type="button" onClick={()=>setShowFundModal(false)} className="px-4 bg-gray-200 text-gray-700 rounded font-bold">Cancelar</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    <div className="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden mt-6 w-full">
                        <div className="bg-gray-50 p-4 border-b flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                            <h2 className="text-lg font-bold text-gray-800">Tabla 1: Desglose de Cartera y Revalorización</h2>
                            <div className="flex items-center gap-2 bg-white px-3 py-1.5 rounded border shadow-sm">
                                <label className="text-xs font-bold text-gray-500 uppercase">Ver Año:</label>

                    <div className="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden mt-6 w-full">

                                                <td className={`px-3 py-2 font-bold border-r text-right ${row.pctCartera >= 0 ? 'text-green-600' : 'text-red-600'}`}>{row.pctCartera == null ? '—' : (row.pctCartera > 0 ? '+' : '') + formatPercent(row.pctCartera)}</td>
                                                <td className={`px-3 py-2 font-medium text-right ${row.diffPatrimonio >= 0 ? 'text-green-600' : 'text-red-600'}`}>{row.diffPatrimonio == null ? '—' : (row.diffPatrimonio > 0 ? '+' : '') + formatCurrency(row.diffPatrimonio)}</td>
                                                <td className={`px-3 py-2 font-bold text-right ${row.pctPatrimonio >= 0 ? 'text-green-600' : 'text-red-600'}`}>{row.pctPatrimonio == null ? '—' : (row.pctPatrimonio > 0 ? '+' : '') + formatPercent(row.pctPatrimonio)}</td>
                                                <td className="px-2 py-2 flex items-center gap-1">
                                                    <button onClick={()=>{
                                                        const targetSnap = snapshots.find(s => s.id === row.id);
                                                        if (targetSnap?.summaryOnly && !targetSnap?.fundsData) {
                                                            showMessage("Este registro histórico contiene solo el resumen de cartera y no el desglose por fondo.");
                                                            return;
                                                        }
                                                        setSnapDate(row.date);
                                                        setSnapLiquidity(row.liquidity || 0);
                                                        setEditingSnapId(row.id);
                                                        if (targetSnap && targetSnap.fundsData) setSnapFundsData(targetSnap.fundsData);

                                                    }} className="px-1.5 py-1 bg-amber-50 text-amber-700 rounded hover:bg-amber-100 text-[10px] font-bold">Editar</button>
                                                    <button onClick={()=>{deleteSnapshot(row.id); showMessage("Registro eliminado");}} className="text-red-400 hover:text-red-600 font-bold text-xs bg-red-50 p-1 rounded">Borrar</button>
                                                </td>

                    <div className="bg-white p-6 rounded-xl shadow-sm border border-gray-200 w-full">

                        <div className="bg-gray-50 p-4 rounded-xl border border-gray-200 mb-6 space-y-4">
                            <div className="flex flex-col sm:flex-row flex-wrap gap-4 items-start sm:items-end">
                                <div>
                                    <label className="block text-xs font-bold text-gray-700 uppercase">Desde (Año / Mes)</label>
                                    <div className="flex gap-2">
                                        <input type="text" value={chartStartYear} onChange={e=>setChartStartYear(e.target.value)} className="p-1 border rounded text-sm bg-white w-20 outline-teal-500 font-bold" />
                                        <select value={chartStartMonth} onChange={e=>setChartStartMonth(e.target.value)} className="p-1 border rounded text-sm bg-white outline-teal-500">
                                            {months.map((m, idx)=><option key={m} value={m}>{monthNames[idx]}</option>)}
                                        </select>
                                    </div>
                                </div>
                                <div>
                                    <label className="block text-xs font-bold text-gray-700 uppercase">Hasta (Año / Mes)</label>
                                    <div className="flex gap-2">
                                        <input type="text" value={chartEndYear} onChange={e=>setChartEndYear(e.target.value)} className="p-1 border rounded text-sm bg-white w-20 outline-teal-500 font-bold" />
                                        <select value={chartEndMonth} onChange={e=>setChartEndMonth(e.target.value)} className="p-1 border rounded text-sm bg-white outline-teal-500">
                                            {months.map((m, idx)=><option key={m} value={m}>{monthNames[idx]}</option>)}
                                        </select>
                                    </div>
                                </div>
                            </div>
                            <div className="bg-white p-3 border rounded shadow-sm">
                                <span className="text-xs font-bold text-gray-700 uppercase mb-2 block">Variables a comparar:</span>
                                <div className="flex flex-wrap gap-3">
                                    {CHART_VARS.map(v => (
                                        <label key={v} className={`flex items-center gap-1 text-sm px-2 py-1 rounded border cursor-pointer select-none transition-colors ${selectedChartVars.includes(v) ? 'bg-teal-50 border-teal-400 font-bold text-teal-900 shadow-sm' : 'bg-white hover:bg-gray-50 text-gray-600'}`}>
                                            <input type="checkbox" checked={selectedChartVars.includes(v)} onChange={()=>handleToggleChartVar(v)} className="w-4 h-4 text-teal-600 rounded" /> {v}
                                        </label>
                                    ))}

                            </div>
                        </div>
                        {chartData.labels.length > 0 && selectedChartVars.length > 0 ? (
                            <SimpleChart data={chartData} type="line" />

                        )}
                    </div>
                </div>
            );
        };

        const GeminisAITab = ({ incomes, expenses, snapshots, funds }) => {
            const [messages, setMessages] = useState([
                { role: 'assistant', content: '¡Hola! Soy tu Asesor Financiero inteligente impulsado por Gemini. Puedo analizar tus ingresos, gastos y cartera, y consultar información actualizada en internet. Antes de usarme, introduce tu clave de Gemini en la configuración inferior.' }
            ]);
            const [input, setInput] = useState('');
            const [loading, setLoading] = useState(false);
            const [apiKey, setApiKey] = useState(() => {
                try { return localStorage.getItem('eco_gemini_api_key') || ''; }
                catch (_) { return ''; }
            });
            const [showKey, setShowKey] = useState(false);

            const saveApiKey = (value) => {
                setApiKey(value);
                try {
                    if (value.trim()) localStorage.setItem('eco_gemini_api_key', value.trim());
                    else localStorage.removeItem('eco_gemini_api_key');
                } catch (_) {}
            };

            const buildContext = () => {
                const latest = snapshots.length
                    ? snapshots.reduce((a, b) => b.date > a.date ? b : a)
                    : null;

                const latestSummary = latest?.summary || {};
                const incomeTotal = incomes.reduce((sum, x) => sum + (Number(x.amount) || 0), 0);
                const expenseTotal = expenses.reduce((sum, x) => sum + (Number(x.amount) || 0), 0);

                return `
DATOS FINANCIEROS LOCALES DE LA FAMILIA
- Ingresos registrados: ${JSON.stringify(incomes)}
- Gastos registrados: ${JSON.stringify(expenses)}
- Fondos configurados: ${JSON.stringify(funds)}
- Histórico patrimonial: ${JSON.stringify(snapshots)}
- Total acumulado de ingresos registrados: ${incomeTotal.toFixed(2)} €
- Total acumulado de gastos registrados: ${expenseTotal.toFixed(2)} €
- Último patrimonio conocido: ${latestSummary.patrimonio ?? 'no disponible'} €
- Última cartera conocida: ${latestSummary.cartera ?? 'no disponible'} €
- Última renta fija: ${latestSummary.rf ?? 'no disponible'} €
- Última renta variable: ${latestSummary.rv ?? 'no disponible'} €
`;
            };

            const handleSend = async (e) => {
                e.preventDefault();
                if (!input.trim() || loading) return;

                const key = apiKey.trim();
                if (!key) {
                    setMessages(prev => [...prev, {
                        role: 'assistant',
                        content: 'Para utilizar el Asesor IA necesitas introducir tu clave de Gemini en la configuración de abajo. La aplicación no lleva ninguna clave incorporada.'
                    }]);
                    return;
                }

                const userMsg = input.trim();
                setInput('');
                setMessages(prev => [...prev, { role: 'user', content: userMsg }]);
                setLoading(true);

                const systemPrompt = `Actúa como un asesor financiero familiar experto, prudente, cercano y claro.
Analiza los datos financieros locales que se te proporcionan y distingue siempre entre datos reales del usuario, cálculos derivados y datos externos.
No inventes cifras. Si falta un dato, dilo.
No presentes recomendaciones de inversión personalizadas como certezas; explica riesgos, supuestos y alternativas.
Cuando la pregunta requiera información actualizada de mercados, economía o actualidad, utiliza Google Search y basa esa parte de la respuesta en fuentes actuales.
Responde en español salvo que el usuario pida otro idioma.`;

                const userQuery = `${buildContext()}\n\nPregunta actual del usuario: ${userMsg}`;

                try {
                    const apiUrl = 'https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent';

                    const payload = {
                        contents: [
                            { role: 'user', parts: [{ text: userQuery }] }
                        ],
                        tools: [{ google_search: {} }],
                        systemInstruction: { parts: [{ text: systemPrompt }] },
                        generationConfig: {
                            temperature: 0.3,
                            maxOutputTokens: 2048
                        }
                    };

                    const response = await fetch(apiUrl, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'x-goog-api-key': key
                        },
                        body: JSON.stringify(payload)
                    });

                    const result = await response.json();

                    if (!response.ok) {
                        const apiMessage = result?.error?.message || `HTTP ${response.status}`;
                        throw new Error(apiMessage);
                    }

                    const parts = result?.candidates?.[0]?.content?.parts || [];
                    const aiText = parts
                        .map(part => part.text || '')
                        .filter(Boolean)
                        .join('\n')
                        .trim();

                    if (!aiText) {
                        throw new Error('Gemini no devolvió texto en la respuesta.');
                    }

                    setMessages(prev => [...prev, { role: 'assistant', content: aiText }]);
                } catch (err) {
                    console.error('Gemini API:', err);
                    setMessages(prev => [...prev, {
                        role: 'assistant',
                        content: `No he podido consultar Gemini. ${err?.message || 'Error desconocido.'}`
                    }]);
                } finally {
                    setLoading(false);
                }
            };

            return (
                <div className="bg-white rounded-xl shadow-sm border border-indigo-100 p-6 flex flex-col h-[600px] fade-in w-full">
                    <div className="border-b pb-4 mb-4">
                        <div className="flex items-center justify-between">
                            <div>
                                <h2 className="text-lg font-bold text-indigo-900 flex items-center gap-2">
                                    <span>🤖</span> Asesor IA (Gemini con Búsqueda Web)
                                </h2>
                                <p className="text-xs text-gray-500">Analiza tus finanzas locales y puede consultar información financiera actualizada.</p>
                            </div>
                        </div>

                        <details className="mt-3">
                            <summary className="cursor-pointer text-xs font-bold text-indigo-700">⚙️ Configurar Gemini</summary>
                            <div className="mt-3 p-3 bg-indigo-50 rounded-lg border border-indigo-100">
                                <p className="text-xs text-gray-600 mb-2">
                                    Introduce tu propia clave de Gemini. No está incluida en este HTML ni en los archivos JSON exportados.
                                </p>
                                <div className="flex gap-2">
                                    <input
                                        type={showKey ? 'text' : 'password'}
                                        value={apiKey}
                                        onChange={e => saveApiKey(e.target.value)}
                                        placeholder="AIza..."
                                        className="flex-1 p-2 border rounded-lg text-xs bg-white"
                                        autoComplete="off"
                                    />
                                    <button
                                        type="button"
                                        onClick={() => setShowKey(v => !v)}
                                        className="px-3 py-2 bg-white border rounded-lg text-xs font-bold"
                                    >
                                        {showKey ? 'Ocultar' : 'Ver'}
                                    </button>
                                    <button
                                        type="button"
                                        onClick={() => saveApiKey('')}
                                        className="px-3 py-2 bg-red-50 text-red-600 border border-red-100 rounded-lg text-xs font-bold"
                                    >
                                        Borrar
                                    </button>
                                </div>
                            </div>
                        </details>
                    </div>

                    <div className="flex-1 overflow-y-auto space-y-4 pr-2 mb-4">
                        {messages.map((m, idx) => (
                            <div key={`${m.role}-${idx}`} className={`flex ${m.role === 'user' ? 'justify-end' : 'justify-start'}`}>
                                <div className={`max-w-[80%] p-4 rounded-xl text-sm leading-relaxed ${m.role === 'user' ? 'bg-blue-600 text-white rounded-br-none' : 'bg-gray-100 text-gray-800 rounded-bl-none border'}`}>
                                    <div className="whitespace-pre-wrap">{m.content}</div>
                                </div>
                            </div>
                        ))}
                        {loading && (
                            <div className="flex justify-start">
                                <div className="bg-gray-100 text-gray-500 p-4 rounded-xl text-sm italic animate-pulse">
                                    Analizando y consultando fuentes de internet...
                                </div>
                            </div>
                        )}
                    </div>

                    <form onSubmit={handleSend} className="flex gap-2 border-t pt-4">
                        <input
                            type="text"
                            value={input}
                            onChange={e => setInput(e.target.value)}
                            placeholder="Ej.: ¿Cómo va mi patrimonio?"
                            className="flex-1 p-3 border rounded-lg outline-indigo-500 text-sm bg-gray-50"
                        />
                        <button
                            type="submit"
                            disabled={loading}
                            className="bg-indigo-600 text-white px-6 py-3 rounded-lg font-bold hover:bg-indigo-700 transition-colors shadow disabled:opacity-50"
                        >
                            {loading ? '...' : 'Enviar'}
                        </button>
                    </form>
                </div>
            );
        };


        const App = () => {
            const [activeTab, setActiveTab] = useState('ingresos');
            const [notification, setNotification] = useState('');
            
            const [incomes, setIncomes] = useState(() => loadSafe(PUBLIC_STORAGE.incomes, INITIAL_INCOMES));
            const [expenses, setExpenses] = useState(() => loadSafe(PUBLIC_STORAGE.expenses, INITIAL_EXPENSES));
            const [snapshots, setSnapshots] = useState(() => loadSafe(PUBLIC_STORAGE.snapshots, INITIAL_SNAPSHOTS));
            const [funds, setFunds] = useState(() => loadSafe(PUBLIC_STORAGE.funds, INITIAL_FUNDS));

            useEffect(() => { saveSafe(PUBLIC_STORAGE.incomes, incomes); }, [incomes]);
            useEffect(() => { saveSafe(PUBLIC_STORAGE.expenses, expenses); }, [expenses]);
            useEffect(() => { saveSafe(PUBLIC_STORAGE.snapshots, snapshots); }, [snapshots]);
            useEffect(() => { saveSafe(PUBLIC_STORAGE.funds, funds); }, [funds]);

            const addIncome = (inc) => setIncomes(prev => [...prev, inc].sort((a,b)=>b.date.localeCompare(a.date)));
            const updateIncome = (updatedInc) => setIncomes(prev => prev.map(i => i.id === updatedInc.id ? updatedInc : i).sort((a,b)=>b.date.localeCompare(a.date)));
            const deleteIncome = (id) => setIncomes(prev => prev.filter(i => i.id !== id));
            
            const addExpense = (exp) => setExpenses(prev => [...prev, exp].sort((a,b)=>b.date.localeCompare(a.date)));
            const updateExpense = (updatedExp) => setExpenses(prev => prev.map(e => e.id === updatedExp.id ? updatedExp : e).sort((a,b)=>b.date.localeCompare(a.date)));
            const deleteExpense = (id) => setExpenses(prev => prev.filter(e => e.id !== id));
            
            const addSnapshot = (snap) => {
                setSnapshots(prev => {
                    const exists = prev.findIndex(s => s.date === snap.date);
                    let newArr = [...prev];
                    if (exists >= 0) newArr[exists] = snap; else newArr.push(snap);
                    return newArr.sort((a,b)=>b.date.localeCompare(a.date));
                });
            };
            const updateSnapshot = (updatedSnap) => {
                setSnapshots(prev => prev.map(s => s.id === updatedSnap.id ? updatedSnap : s).sort((a,b)=>b.date.localeCompare(a.date)));
            };
            const deleteSnapshot = (id) => setSnapshots(prev => prev.filter(s => s.id !== id));

            const handleExport = () => {
                const tabla2EvolucionPatrimonial = snapshots
                    .slice()
                    .sort((a,b) => b.date.localeCompare(a.date))
                    .map(s => ({
                        date: s.date,
                        ingresoTotal: s.table2?.ingresoTotal ?? s.summary?.ingresoTotal ?? null,
                        rf: s.table2?.rf ?? s.summary?.rf ?? null,
                        rv: s.table2?.rv ?? s.summary?.rv ?? null,
                        cartera: s.table2?.cartera ?? s.summary?.cartera ?? null,
                        patrimonio: s.table2?.patrimonio ?? s.summary?.patrimonio ?? null,
                        diffCartera: s.table2?.diffCartera ?? null,
                        diffCarteraPct: s.table2?.diffCarteraPct ?? null,
                        diffPatrimonio: s.table2?.diffPatrimonio ?? null,
                        diffPatrimonioPct: s.table2?.diffPatrimonioPct ?? null
                    }));
                const data = { incomes, expenses, snapshots, funds, tabla2EvolucionPatrimonial };
                const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url; a.download = `CopiaSeguridad_EconomiaFamiliar.json`;
                a.click();
                setNotification("Copia de seguridad descargada. Guárdala en un lugar seguro.");
            };

            const handleImport = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const data = JSON.parse(event.target.result);
                        if (typeof data !== 'object' || data === null) {
                            throw new Error('El archivo no contiene un objeto JSON válido.');
                        }

                        // Solo se restaura cada bloque si viene en el formato esperado (array),
                        // así un campo ausente o corrupto no rompe el resto de la importación.
                        let imported = 0;
                        if (Array.isArray(data.incomes)) { setIncomes(data.incomes); imported++; }
                        if (Array.isArray(data.expenses)) { setExpenses(data.expenses); imported++; }
                        if (Array.isArray(data.funds)) { setFunds(data.funds); imported++; }

                        // Tabla 2 puede venir como bloque explícito o dentro de snapshots.
                        // Si existe el bloque explícito, lo usamos para garantizar que no
                        // se pierda ningún registro histórico.
                        let importedSnapshots = Array.isArray(data.snapshots) ? data.snapshots : [];
                        if (Array.isArray(data.tabla2EvolucionPatrimonial)) {
                            const byDate = new Map(importedSnapshots.map(s => [s.date, s]));
                            data.tabla2EvolucionPatrimonial.forEach(row => {
                                const existing = byDate.get(row.date) || {
                                    id: `snap_${row.date}`,
                                    date: row.date,
                                    liquidity: row.patrimonio != null && row.cartera != null
                                        ? row.patrimonio - row.cartera : 0,
                                    fundsData: {},
                                    summaryOnly: true
                                };
                                existing.table2 = {
                                    ingresoTotal: row.ingresoTotal ?? null,
                                    rf: row.rf ?? null,
                                    rv: row.rv ?? null,
                                    cartera: row.cartera ?? null,
                                    patrimonio: row.patrimonio ?? null,
                                    diffCartera: row.diffCartera ?? null,
                                    diffCarteraPct: row.diffCarteraPct ?? null,
                                    diffPatrimonio: row.diffPatrimonio ?? null,
                                    diffPatrimonioPct: row.diffPatrimonioPct ?? null
                                };
                                existing.summary = {
                                    ingresoTotal: row.ingresoTotal ?? null,
                                    rf: row.rf ?? null,
                                    rv: row.rv ?? null,
                                    cartera: row.cartera ?? null,
                                    patrimonio: row.patrimonio ?? null
                                };
                                byDate.set(row.date, existing);
                            });
                            importedSnapshots = Array.from(byDate.values())
                                .sort((a,b) => b.date.localeCompare(a.date));
                        }

                        if (importedSnapshots.length) {
                            setSnapshots(importedSnapshots);
                            imported++;
                        }

                        if (imported === 0) {
                            setNotification("❌ Error: El archivo no contiene datos reconocibles.");
                        } else {
                            setNotification(`Datos restaurados correctamente. Tabla 2: ${importedSnapshots.length} registros.`);
                        }
                    } catch (err) {
                        console.error("Error al importar copia de seguridad:", err);
                        setNotification("❌ Error: El archivo no es válido.");
                    }
                };
                reader.onerror = () => setNotification("❌ Error: No se pudo leer el archivo.");
                reader.readAsText(file);
                e.target.value = '';
            };

            return (
                <div className="min-h-screen pb-20 w-full overflow-x-hidden">
                    <Notification message={notification} onClose={() => setNotification('')} />
                    
                    <header className="bg-white shadow-sm border-b sticky top-0 z-50">
                        <div className="w-full px-4 sm:px-6 lg:px-8">
                            <div className="flex flex-col sm:flex-row justify-between items-center py-4 gap-4">
                                <h1 className="text-xl font-black text-gray-900 tracking-tight flex items-center gap-2">
                                    <span className="text-2xl">💼</span> Economía Familiar
                                </h1>
                                <div className="flex flex-wrap gap-2 items-center">
                                    <button onClick={handleExport} className="px-3 py-1.5 bg-gray-100 text-gray-700 rounded text-xs font-bold hover:bg-gray-200 shadow-sm border border-gray-300">⬇️ Exportar Datos</button>
                                    <label className="px-3 py-1.5 bg-blue-50 text-blue-700 rounded text-xs font-bold hover:bg-blue-100 cursor-pointer shadow-sm border border-blue-200">
                                        ⬆️ Importar Datos
                                        <input type="file" accept=".json" className="hidden" onChange={handleImport} />
                                    </label>
                                </div>
                            </div>
                            <nav className="flex space-x-6 mt-2 overflow-x-auto no-scrollbar">
                                <button onClick={() => setActiveTab('ingresos')} className={`pb-3 px-1 transition-colors whitespace-nowrap ${activeTab === 'ingresos' ? 'tab-active' : 'tab-inactive'}`}>Ingresos</button>
                                <button onClick={() => setActiveTab('gastos')} className={`pb-3 px-1 transition-colors whitespace-nowrap ${activeTab === 'gastos' ? 'tab-active' : 'tab-inactive'}`}>Gastos</button>
                                <button onClick={() => setActiveTab('inversiones')} className={`pb-3 px-1 transition-colors whitespace-nowrap ${activeTab === 'inversiones' ? 'tab-active' : 'tab-inactive'}`}>Cartera de Inversión</button>
                                <button onClick={() => setActiveTab('ia')} className={`pb-3 px-1 transition-colors whitespace-nowrap flex items-center gap-1 ${activeTab === 'ia' ? 'tab-active' : 'tab-inactive'}`}><span>🤖</span> Asesor IA</button>
                            </nav>
                        </div>
                    </header>

                    <main className="w-full px-4 sm:px-6 lg:px-8 py-8">
                        {activeTab === 'ingresos' && <IngresosTab incomes={incomes} addIncome={addIncome} updateIncome={updateIncome} deleteIncome={deleteIncome} showMessage={setNotification} />}
                        {activeTab === 'gastos' && <GastosTab expenses={expenses} addExpense={addExpense} updateExpense={updateExpense} deleteExpense={deleteExpense} incomes={incomes} showMessage={setNotification} />}
                        {activeTab === 'inversiones' && <InversionesTab funds={funds} setFunds={setFunds} snapshots={snapshots} addSnapshot={addSnapshot} updateSnapshot={updateSnapshot} deleteSnapshot={deleteSnapshot} showMessage={setNotification} />}
                        {activeTab === 'ia' && <GeminisAITab incomes={incomes} expenses={expenses} snapshots={snapshots} funds={funds} />}
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
